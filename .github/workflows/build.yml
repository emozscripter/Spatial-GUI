name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew :20.1-fabric:build
      - uses: actions/upload-artifact@v4
        with:
          name: Spatial-GUI-Jar
          path: "**/build/libs/*.jar"
