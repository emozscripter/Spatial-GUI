name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew build -x :26.2-neoforge:compileJava -x :26.3-neoforge:compileJava
      - uses: actions/upload-artifact@v4
        with:
          name: Spatial-GUI-Jar
          path: "**/build/libs/*.jar"
